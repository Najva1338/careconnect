<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title }} | CareConnect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">

<nav class="navbar bg-white shadow-sm">
    <div class="container py-2">
        <a class="navbar-brand fw-bold text-success"
           href="{% url 'home' %}">
            <i class="bi bi-heart-pulse-fill"></i> CareConnect
        </a>

        <a href="{% url 'staff_hospitals' %}"
           class="btn btn-outline-success">
            <i class="bi bi-arrow-left"></i> Back to Hospitals
        </a>
    </div>
</nav>

<div class="container py-5">
    <div class="card border-0 shadow-sm rounded-4 mx-auto"
         style="max-width: 850px;">

        <div class="card-header bg-success text-white p-4">
            <h3 class="mb-1">{{ page_title }}</h3>
            <p class="mb-0">Enter hospital information below.</p>
        </div>

        <div class="card-body p-4">
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            {{ field.label }}
                        </label>

                        {{ field }}

                        {% if field.errors %}
                            <div class="text-danger small">
                                {{ field.errors }}
                            </div>
                        {% endif %}
                    </div>
                {% endfor %}

                <button type="submit" class="btn btn-success px-4">
                    <i class="bi bi-check-circle"></i> Save Hospital
                </button>

                <a href="{% url 'staff_hospitals' %}"
                   class="btn btn-outline-secondary px-4">
                    Cancel
                </a>
            </form>
        </div>
    </div>
</div>

</body>
</html>
